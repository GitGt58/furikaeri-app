<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふりかえりBot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1c1c1c; --ink2: #555; --ink3: #999;
  --surface: #f5f4f0; --card: #ffffff;
  --border: #e4e2db; --border2: #ccc9bf;
  --accent: #2d6a4f; --accent-lt: #d8f3dc; --accent-mid: #52b788;
  --warn: #c0392b; --warn-lt: #fdecea;
  --blue: #1d4ed8; --blue-lt: #eff6ff;
  --amber-lt: #fffbeb;
  --r: 12px; --r-sm: 8px;
}

body { font-family:'Noto Sans JP',sans-serif; background:var(--surface); color:var(--ink); min-height:100vh; font-size:14px; line-height:1.6; }

/* ===== TOPBAR ===== */
.topbar { background:var(--card); border-bottom:1px solid var(--border); padding:0 20px; height:52px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:200; }
.topbar-left { display:flex; align-items:center; gap:10px; }
.logo { width:30px; height:30px; background:var(--accent); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:15px; }
.app-title { font-size:15px; font-weight:700; letter-spacing:-.3px; }

/* ===== NAV ===== */
.nav-tabs { display:flex; background:var(--card); border-bottom:1px solid var(--border); padding:0 20px; gap:2px; }
.nav-tab { padding:10px 14px; font-size:13px; font-weight:500; color:var(--ink3); border-bottom:2px solid transparent; cursor:pointer; transition:all .15s; background:none; border-top:none; border-left:none; border-right:none; font-family:'Noto Sans JP',sans-serif; white-space:nowrap; }
.nav-tab:hover { color:var(--ink2); }
.nav-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* ===== PAGE ===== */
.page { display:none; padding:20px; max-width:680px; margin:0 auto; width:100%; }
.page.active { display:block; }

/* ===== COMMON ===== */
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:18px 20px; margin-bottom:12px; }
.section-title { font-size:16px; font-weight:700; margin-bottom:4px; }
.section-sub { font-size:12px; color:var(--ink3); margin-bottom:16px; }
label.lbl { font-size:12px; font-weight:500; color:var(--ink2); display:block; margin-bottom:5px; }
input[type="text"], input[type="password"], textarea, select { width:100%; padding:9px 12px; border:1.5px solid var(--border2); border-radius:var(--r-sm); font-size:13px; font-family:'Noto Sans JP',sans-serif; color:var(--ink); background:var(--surface); outline:none; transition:border-color .2s, background .2s; }
input:focus, textarea:focus, select:focus { border-color:var(--accent-mid); background:var(--card); }
textarea { resize:vertical; line-height:1.7; }
.frow { margin-bottom:14px; }
.fhint { font-size:11px; color:var(--ink3); margin-top:4px; }

.btn { padding:9px 18px; border-radius:var(--r-sm); font-size:13px; font-weight:500; font-family:'Noto Sans JP',sans-serif; cursor:pointer; border:1.5px solid transparent; transition:all .15s; display:inline-flex; align-items:center; gap:6px; }
.btn:active { transform:scale(.97); }
.btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-primary:hover { background:#245c43; }
.btn-secondary { background:var(--card); color:var(--ink2); border-color:var(--border2); }
.btn-secondary:hover { border-color:var(--accent-mid); color:var(--accent); }
.btn-ghost { background:none; border-color:transparent; color:var(--ink3); }
.btn-ghost:hover { color:var(--ink); background:var(--surface); }
.btn-danger { background:var(--warn-lt); color:var(--warn); border-color:#f5c6c2; }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-full { width:100%; justify-content:center; padding:12px; font-size:14px; }
.btn-icon { padding:7px 10px; }

/* ===== GOAL CARDS ===== */
.goal-item { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:15px 17px; margin-bottom:10px; }
.goal-item-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.goal-title { font-size:14px; font-weight:700; }
.goal-meta { font-size:11px; color:var(--ink3); margin-top:3px; font-family:'DM Mono',monospace; }
.goal-cat { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; margin-top:6px; display:inline-block; }
.cat-health { background:#d1fae5; color:#065f46; }
.cat-study  { background:#dbeafe; color:#1e40af; }
.cat-career { background:#fef9c3; color:#92400e; }
.cat-other  { background:#f3f4f6; color:#374151; }
.goal-prog-wrap { height:4px; background:var(--border); border-radius:2px; margin-top:10px; }
.goal-prog { height:100%; background:var(--accent-mid); border-radius:2px; transition:width .4s; }

/* ===== CHIP ===== */
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip { padding:5px 13px; border-radius:20px; font-size:12px; font-weight:500; border:1.5px solid var(--border2); color:var(--ink2); cursor:pointer; background:var(--card); transition:all .12s; font-family:'Noto Sans JP',sans-serif; user-select:none; }
.chip:hover { border-color:var(--accent-mid); }
.chip.sel { background:var(--accent-lt); border-color:var(--accent); color:var(--accent); }

/* ===== QA CHAT UI ===== */
#qa-wrap { display:flex; flex-direction:column; height:calc(100vh - 100px); max-width:680px; margin:0 auto; }

.qa-progress-bar-wrap { background:var(--card); border-bottom:1px solid var(--border); padding:10px 20px 8px; position:sticky; top:52px; z-index:100; }
.qa-progress-meta { display:flex; justify-content:space-between; font-size:12px; color:var(--ink3); margin-bottom:5px; }
.qa-bar-bg { height:5px; background:var(--border); border-radius:3px; }
.qa-bar-fg { height:100%; background:var(--accent-mid); border-radius:3px; transition:width .5s ease; }

.qa-messages { flex:1; overflow-y:auto; padding:20px 20px 10px; display:flex; flex-direction:column; gap:14px; max-width:680px; margin:0 auto; width:100%; }

.bubble-wrap { display:flex; flex-direction:column; }
.bubble-wrap.bot { align-items:flex-start; }
.bubble-wrap.user { align-items:flex-end; position:relative; max-width:100%; }

.bubble { border-radius:16px; padding:11px 15px; font-size:13px; line-height:1.7; animation:bubbleIn .2s ease; max-width:85%; }
@keyframes bubbleIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.bubble.bot { background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; color:var(--ink); white-space:pre-wrap; word-break:break-word; }
/* ユーザーバブル：
   white-space:pre   → \nのみで改行。CSSによる自動折り返しを完全に無効化
   display:inline-block → テキスト幅に合わせてバブル幅が伸縮する
   max-width:85%     → 画面幅の85%を超えないよう上限を設定
   wrapLong(30文字)で\nを挿入済みなので30文字を超える行は存在しない */
.bubble.user {
  background:var(--accent); color:#fff; border-bottom-right-radius:4px;
  white-space:pre;
  display:inline-block;
  max-width:85%;
  vertical-align:top;
}
.bubble.system { background:var(--surface); border:1px dashed var(--border2); color:var(--ink2); font-size:12px; text-align:center; border-radius:8px; max-width:100%; align-self:center; padding:8px 14px; }
.bubble-sender { font-size:11px; color:var(--ink3); margin-bottom:4px; font-weight:500; }
.bubble-wrap.user .bubble-sender { text-align:right; }

/* スライダーバブル */
.slider-bubble { padding:14px 16px; }
.slider-val-big { font-family:'DM Mono',monospace; font-size:32px; font-weight:500; color:var(--accent); text-align:center; margin-bottom:8px; }
input.qa-slider { width:100%; height:6px; appearance:none; -webkit-appearance:none; background:var(--border); border-radius:3px; cursor:pointer; outline:none; border:none; padding:0; }
input.qa-slider::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; background:var(--card); border:2.5px solid var(--accent); border-radius:50%; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.15); }
.slider-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--ink3); margin-top:4px; font-family:'DM Mono',monospace; }

/* AI候補チップ（明日やること） */
.tomorrow-candidates { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.candidate-chip {
  padding:8px 13px; border-radius:var(--r-sm); font-size:12px;
  border:1.5px solid var(--border2); background:var(--card); color:var(--ink2);
  cursor:pointer; transition:all .12s; text-align:left; font-family:'Noto Sans JP',sans-serif;
  line-height:1.5;
}
.candidate-chip:hover { border-color:var(--accent-mid); background:var(--accent-lt); color:var(--accent); }
.candidate-chip.used { background:var(--accent-lt); border-color:var(--accent); color:var(--accent); pointer-events:none; }
.candidate-loading { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink3); margin-top:10px; }

/* 回答編集ボタン */
.edit-answer-btn { position:absolute; top:20px; left:-30px; width:24px; height:24px; border-radius:50%; background:var(--card); border:1px solid var(--border2); color:var(--ink3); font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; box-shadow:0 1px 4px rgba(0,0,0,.1); }
.bubble-wrap.user:hover .edit-answer-btn { opacity:1; }
.edit-answer-btn:hover { background:var(--surface); color:var(--accent); border-color:var(--accent-mid); }

/* 入力エリア */
.qa-input-area { background:var(--card); border-top:1px solid var(--border); padding:12px 20px 16px; position:sticky; bottom:0; max-width:680px; margin:0 auto; width:100%; }
.qa-input-row { display:flex; gap:8px; align-items:flex-end; }
.qa-textarea { flex:1; border:1.5px solid var(--border2); border-radius:var(--r-sm); padding:9px 13px; font-size:13px; font-family:'Noto Sans JP',sans-serif; color:var(--ink); background:var(--surface); outline:none; resize:none; line-height:1.6; max-height:120px; transition:border-color .2s, background .2s; min-height:42px; }
.qa-textarea:focus { border-color:var(--accent-mid); background:var(--card); }
.qa-send-btn { width:42px; height:42px; border-radius:50%; background:var(--accent); border:none; color:#fff; cursor:pointer; font-size:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.qa-send-btn:hover { background:#245c43; }
.qa-send-btn:active { transform:scale(.93); }
.qa-send-btn:disabled { background:var(--border2); cursor:not-allowed; }
.qa-hint { font-size:11px; color:var(--ink3); margin-top:5px; text-align:center; }

/* タイピング */
.typing-bubble { display:flex; align-items:center; gap:5px; padding:12px 15px; }
.dot { width:7px; height:7px; background:var(--ink3); border-radius:50%; animation:blink 1.2s infinite; }
.dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* まとめ結果 */
.result-card { background:var(--card); border:1.5px solid var(--accent-mid); border-radius:var(--r); padding:18px 20px; margin:16px 20px; }
.result-title { font-size:14px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.result-text { font-size:13px; line-height:1.9; white-space:pre-wrap; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:14px 16px; margin-bottom:12px; }
.result-actions { display:flex; gap:8px; flex-wrap:wrap; }

/* ===== 履歴 ===== */
.hist-item { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:14px 17px; margin-bottom:10px; }
.hist-date { font-family:'DM Mono',monospace; font-size:11px; color:var(--ink3); margin-bottom:6px; }
.hist-ach { display:inline-block; font-family:'DM Mono',monospace; font-size:11px; font-weight:500; padding:2px 8px; border-radius:20px; background:var(--accent-lt); color:var(--accent); margin-bottom:6px; }
.hist-summary { font-size:12px; color:var(--ink2); white-space:pre-wrap; line-height:1.7; }

/* 編集モーダル */
.edit-slider-val { font-family:'DM Mono',monospace; font-size:28px; font-weight:500; color:var(--accent); text-align:center; margin-bottom:8px; }
.edit-slider { width:100%; height:6px; appearance:none; -webkit-appearance:none; background:var(--border); border-radius:3px; cursor:pointer; outline:none; border:none; padding:0; }
.edit-slider::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; background:var(--card); border:2.5px solid var(--accent); border-radius:50%; cursor:pointer; }

/* ===== MODAL ===== */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:500; align-items:center; justify-content:center; padding:16px; }
.overlay.show { display:flex; }
.modal { background:var(--card); border-radius:var(--r); padding:22px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; }
.modal-title { font-size:15px; font-weight:700; margin-bottom:16px; }
.modal-footer { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }

/* ===== EMPTY / TOAST ===== */
.empty { text-align:center; padding:48px 20px; color:var(--ink3); }
.empty-icon { font-size:40px; margin-bottom:10px; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(60px); background:#1c1c1c; color:#fff; padding:10px 20px; border-radius:20px; font-size:13px; font-weight:500; transition:transform .3s; z-index:999; white-space:nowrap; }
.toast.show { transform:translateX(-50%) translateY(0); }

@media(max-width:480px){.page{padding:14px;}.nav-tab{padding:10px 10px;font-size:12px;}.qa-messages{padding:14px 14px 8px;}.qa-input-area{padding:10px 14px 14px;}}

  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">🎯</div>
    <span class="app-title">ふりかえりBot</span>
  </div>
  <span id="today-lbl" style="font-size:11px;color:var(--ink3);font-family:'DM Mono',monospace;"></span>
</div>

<div class="nav-tabs">
  <button class="nav-tab active" data-page="goals" onclick="showPage(this)">🎯 目標</button>
  <button class="nav-tab" data-page="furikaeri" onclick="showPage(this)">✏️ 振り返り</button>
  <button class="nav-tab" data-page="history" onclick="showPage(this)">📋 履歴</button>
</div>

<!-- ========== 目標 ========== -->
<div class="page active" id="page-goals">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <div>
      <div class="section-title">2ヶ月の目標</div>
      <div class="section-sub" style="margin-bottom:0;">達成したい目標を登録してください</div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openGoalModal()">＋ 追加</button>
  </div>
  <div id="goals-list"></div>
  <div class="empty" id="goals-empty" style="display:none;">
    <div class="empty-icon">🎯</div>
    <div style="font-size:13px;">まだ目標がありません<br>「追加」ボタンから登録しましょう</div>
  </div>
</div>

<!-- ========== 振り返り ========== -->
<div class="page" id="page-furikaeri" style="padding:0;">

  <div id="qa-start" style="padding:20px;max-width:680px;margin:0 auto;">
    <div class="section-title">今日の振り返り</div>
    <div class="section-sub">全ての目標について1問1答で振り返ります</div>
    <div id="qa-start-goals"></div>
    <div class="empty" id="qa-empty" style="display:none;">
      <div class="empty-icon">📋</div>
      <div style="font-size:13px;">目標が登録されていません<br>「目標」タブから追加してください</div>
    </div>
    <button class="btn btn-primary btn-full" id="qa-start-btn" onclick="startQA()" style="margin-top:14px;display:none;">
      振り返りを始める →
    </button>
  </div>

  <div id="qa-wrap" style="display:none;">
    <div class="qa-progress-bar-wrap">
      <div class="qa-progress-meta">
        <span id="qa-prog-label">振り返り中...</span>
        <span id="qa-prog-num" style="font-family:'DM Mono',monospace;">0%</span>
      </div>
      <div class="qa-bar-bg"><div class="qa-bar-fg" id="qa-bar" style="width:0%"></div></div>
    </div>
    <div class="qa-messages" id="qa-messages"></div>
    <div class="qa-input-area" id="qa-input-area">
      <div class="qa-input-row">
        <textarea class="qa-textarea" id="qa-textarea" rows="1"
          placeholder="回答を入力... (Shift+Enter で送信 / Enter で改行)"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"></textarea>
        <button class="qa-send-btn" id="qa-send" onclick="sendAnswer()">↑</button>
      </div>
      <div class="qa-hint" id="qa-hint">Shift+Enter で送信　/ Enter で改行</div>
    </div>
  </div>
</div>

<!-- ========== 履歴 ========== -->
<div class="page" id="page-history">
  <div class="section-title">振り返り履歴</div>
  <div class="section-sub">過去の記録を確認できます</div>
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <select id="hist-filter" onchange="renderHistory()" style="flex:1;"><option value="">すべての日付</option></select>
    <button class="btn btn-secondary btn-sm" onclick="exportData()">📤 エクスポート</button>
    <button class="btn btn-ghost btn-sm" style="color:var(--warn);" onclick="clearHistory()">🗑 削除</button>
  </div>
  <div id="history-list"></div>
  <div class="empty" id="history-empty" style="display:none;">
    <div class="empty-icon">📋</div>
    <div style="font-size:13px;">まだ記録がありません</div>
  </div>
</div>

<!-- ========== 目標モーダル ========== -->
<div class="overlay" id="goal-modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">目標を追加</div>
    <div class="frow">
      <label class="lbl">目標タイトル <span style="color:var(--warn)">*</span></label>
      <input type="text" id="m-title" placeholder="例：体重を5キロ落とす、TOEIC700点取得">
    </div>
    <div class="frow">
      <label class="lbl">目標の詳細・背景（任意）</label>
      <textarea id="m-desc" rows="2" placeholder="例：健康診断でD判定。食事管理と週3回の運動を継続する"></textarea>
    </div>
    <div class="frow">
      <label class="lbl">カテゴリ</label>
      <div class="chips">
        <span class="chip sel" data-cat="health" onclick="selCat(this)">🏃 健康・運動</span>
        <span class="chip" data-cat="study"  onclick="selCat(this)">📚 学習・スキル</span>
        <span class="chip" data-cat="career" onclick="selCat(this)">💼 仕事・キャリア</span>
        <span class="chip" data-cat="other"  onclick="selCat(this)">✨ その他</span>
      </div>
    </div>
    <div class="frow" style="margin-bottom:0;">
      <label class="lbl">期間</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div>
          <div style="font-size:11px;color:var(--ink3);margin-bottom:3px;">開始日</div>
          <input type="text" id="m-start" placeholder="2025/05/01">
        </div>
        <div>
          <div style="font-size:11px;color:var(--ink3);margin-bottom:3px;">終了日</div>
          <input type="text" id="m-end" placeholder="2025/06/30">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeGoalModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveGoal()">保存</button>
    </div>
  </div>
</div>

<!-- ========== 回答編集モーダル ========== -->
<div class="overlay" id="edit-answer-modal">
  <div class="modal">
    <div class="modal-title" id="edit-modal-title">回答を修正</div>
    <div id="edit-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="applyEdit()">修正を反映する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  <script>
// ===== WORKER URL =====
// Cloudflare Workerのデプロイ後にURLを設定してください
// 例: 'https://furikaeri-bot-api.YOUR_SUBDOMAIN.workers.dev'
const WORKER_URL = 'https://furikaeri-bot-api.YOUR_SUBDOMAIN.workers.dev';

// ===== STATE =====
let db = { goals:[], sessions:[] };
let editGoalId = null;
let selCatVal  = 'health';
let editCtx    = null;

let qa = {
  active: false,
  questions: [],
  currentIdx: 0,
  answers: {},
  sliderVal: 60,
};

// ===== INIT =====
function init() {
  loadData();
  setToday();
  renderGoals();
  renderQAStart();
  renderHistory();
}

function setToday() {
  const d=new Date(), wd=['日','月','火','水','木','金','土'];
  document.getElementById('today-lbl').textContent =
    `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}(${wd[d.getDay()]})`;
}
const p   = n => String(n).padStart(2,'0');
const dateStr = d => { d=d||new Date(); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`; };
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ===== wrapLong =====
// 優先順位: 1.\n(意図的改行)を保持 2.。の後で改行 3.20文字超えで強制改行
function wrapLong(text, n=20) {
  return text.split('\n').map(line => {
    const sentences = line.split(/(?<=。)/);
    const result = [];
    let current = '';
    for (const seg of sentences) {
      if ((current + seg).length > n && current.length > 0) {
        result.push(current);
        current = seg;
      } else {
        current += seg;
      }
      if (current.endsWith('。')) {
        result.push(current);
        current = '';
      }
    }
    while (current.length > n) {
      result.push(current.slice(0, n));
      current = current.slice(n);
    }
    if (current) result.push(current);
    return result.join('\n');
  }).join('\n');
}

// ===== QA ENGINE =====
function buildQuestions(){
  const qs=[];
  db.goals.forEach(g=>{
    qa.answers[g.id]={goalId:g.id,goalTitle:g.title,achievement:60,good:'',bad:'',tomorrow:''};
    qs.push({goalId:g.id,type:'section_start',goalTitle:g.title});
    qs.push({goalId:g.id,type:'slider',key:'achievement',text:`【${g.title}】\n\n今日の達成度を教えてください。`});
    qs.push({goalId:g.id,type:'text',key:'good',text:`うまくいったことや、良かったことを教えてください。\n\n（思い浮かばなければ「特になし」と入力してください）`});
    qs.push({goalId:g.id,type:'text',key:'bad',text:`できなかったことや、改善したい点はありますか？`});
    qs.push({goalId:g.id,type:'tomorrow',key:'tomorrow',text:`明日やることを教えてください。`});
  });
  return qs;
}

function startQA(){
  if(!db.goals.length) return;
  qa.active=true;
  qa.questions=buildQuestions();
  qa.currentIdx=0;
  qa.answers={};
  db.goals.forEach(g=>{ qa.answers[g.id]={goalId:g.id,goalTitle:g.title,achievement:60,good:'',bad:'',tomorrow:''}; });
  document.getElementById('qa-start').style.display='none';
  document.getElementById('qa-wrap').style.display='flex';
  document.getElementById('qa-messages').innerHTML='';
  addBubble('bot',`こんにちは！今日の振り返りを始めましょう。\n登録されている目標 ${db.goals.length}件 について、1つずつ質問します。`);
  setTimeout(()=>stepNext(),600);
}

function stepNext(){
  if(qa.currentIdx>=qa.questions.length){ finishQA(); return; }
  const q=qa.questions[qa.currentIdx];
  updateProgress();

  if(q.type==='section_start'){
    addSystemBubble(`── ${q.goalTitle} ──`);
    qa.currentIdx++;
    setTimeout(()=>stepNext(),400);
    return;
  }
  if(q.type==='slider'){
    addSliderBubble(q);
    setInputDisabled(true);
    return;
  }
  if(q.type==='tomorrow'){
    addBubble('bot',q.text);
    setInputDisabled(false);
    // Worker URLが設定されていればAI提案を表示
    if(aiAvailable()){
      addTomorrowCandidates(q.goalId);
    }
    document.getElementById('qa-textarea').focus();
    return;
  }
  // 通常テキスト
  addBubble('bot',q.text);
  setInputDisabled(false);
  document.getElementById('qa-textarea').focus();
}

// ===== 送信（Shift+Enter） =====
function handleKey(e){
  if(e.key==='Enter' && e.shiftKey){ e.preventDefault(); sendAnswer(); }
}

function sendAnswer(){
  if(!qa.active) return;
  const ta=document.getElementById('qa-textarea');
  const val=ta.value.trim();
  if(!val) return;
  const q=qa.questions[qa.currentIdx];
  if(!q||q.type==='slider') return;

  const bubbleId=`${q.goalId}__${q.key}`;
  const existing=document.querySelector(`[data-bubble-id="${bubbleId}"]`);
  if(existing){
    const textEl=document.getElementById(`bubble-text-${bubbleId}`);
    if(textEl) textEl.textContent=wrapLong(val);
  } else {
    addBubble('user',val,bubbleId);
  }
  ta.value=''; autoResize(ta);
  qa.answers[q.goalId][q.key]=val;
  setInputDisabled(true);
  qa.currentIdx++;
  setTimeout(()=>stepNext(),500);
}

// ===== 明日の候補（Cloudflare Worker経由） =====
async function addTomorrowCandidates(goalId){
  const g=db.goals.find(x=>x.id===goalId);
  const ans=qa.answers[goalId];
  if(!g||!ans) return;

  const loadingId='tomorrow-loading-'+goalId;
  const loadWrap=document.createElement('div');
  loadWrap.className='bubble-wrap bot'; loadWrap.id=loadingId;
  loadWrap.innerHTML=`<div class="bubble-sender">ふりかえりBot</div>
    <div class="bubble bot"><div class="candidate-loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span style="margin-left:4px;">明日の行動を考えています...</span></div></div>`;
  document.getElementById('qa-messages').appendChild(loadWrap);
  scrollBottom();

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        goalTitle:   g.title,
        goalDesc:    g.desc || '',
        achievement: ans.achievement,
        good:        ans.good  || '',
        bad:         ans.bad   || '',
      }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    loadWrap.remove();

    let candidates = data.candidates || [];
    if (candidates.length === 0 && data.raw) {
      candidates = data.raw.split('\n').map(l=>l.trim())
        .filter(l=>/^[1-3][.\．]/.test(l))
        .map(l=>l.replace(/^[1-3][.\．]\s*/,'').trim())
        .filter(Boolean).slice(0,3);
    }
    if (!candidates.length) return;

    const candWrap=document.createElement('div');
    candWrap.className='bubble-wrap bot';
    const chipHtml=candidates.map((c,i)=>`
      <button class="candidate-chip" id="cand-${goalId}-${i}"
        onclick="selectCandidate('${goalId}',${i},'${c.replace(/'/g,"\\'")}')">
        ${i+1}. ${esc(c)}
      </button>`).join('');
    candWrap.innerHTML=`<div class="bubble-sender">ふりかえりBot</div>
      <div class="bubble bot">
        <div style="font-size:12px;color:var(--ink3);margin-bottom:6px;">💡 候補から選ぶか、直接入力してください</div>
        <div class="tomorrow-candidates">${chipHtml}</div>
      </div>`;
    document.getElementById('qa-messages').appendChild(candWrap);
    scrollBottom();
  } catch(e){
    loadWrap.remove();
    const errWrap=document.createElement('div');
    errWrap.className='bubble-wrap bot';
    errWrap.innerHTML=`<div class="bubble-sender">ふりかえりBot</div>
      <div class="bubble bot" style="font-size:12px;color:var(--ink3);">
        💡 AI提案を取得できませんでした。直接入力してください。
      </div>`;
    document.getElementById('qa-messages').appendChild(errWrap);
    scrollBottom();
  }
}

function selectCandidate(goalId, idx, text){
  document.querySelectorAll(`[id^="cand-${goalId}-"]`).forEach(el=>el.classList.remove('used'));
  document.getElementById(`cand-${goalId}-${idx}`).classList.add('used');
  const ta=document.getElementById('qa-textarea');
  ta.value=text; autoResize(ta); ta.focus();
}

// ===== FINISH（テンプレートのみ） =====
async function finishQA(){
  setInputDisabled(true);
  document.getElementById('qa-hint').textContent='';

  addBubble('bot',`お疲れ様でした！全ての目標について振り返りが完了しました 🎉\n\nまとめ文を生成しています...`);

  const answersArr=db.goals.map(g=>qa.answers[g.id]).filter(Boolean);
  const today=dateStr();
  const summaryText=generateSummaryTemplate(answersArr,today);

  // セッション保存
  db.sessions.push({id:'s_'+Date.now(),date:today,answers:answersArr,summary:summaryText,createdAt:new Date().toISOString()});
  saveData(); renderGoals();

  // プログレス100%
  document.getElementById('qa-bar').style.width='100%';
  document.getElementById('qa-prog-num').textContent='100%';
  document.getElementById('qa-prog-label').textContent=`目標 ${db.goals.length}/${db.goals.length} 振り返り完了`;

  // 結果表示
  const resultWrap=document.createElement('div');
  resultWrap.style.cssText='padding:0 0 20px;';
  resultWrap.innerHTML=`
    <div class="result-card">
      <div class="result-title">📝 振り返りまとめ</div>
      <div class="result-text" id="final-result">${esc(summaryText)}</div>
      <div class="result-actions">
        <button class="btn btn-primary btn-sm" onclick="copyFinalResult()">📋 Slack用にコピー</button>
        <button class="btn btn-secondary btn-sm" onclick="restartQA()">🔄 もう一度振り返る</button>
      </div>
    </div>`;
  document.getElementById('qa-messages').appendChild(resultWrap);
  scrollBottom();
  qa.active=false;
}

function generateSummaryTemplate(answers,today){
  let txt=`📅 ${today} の振り返り\n\n`;
  answers.forEach(a=>{
    const emoji=a.achievement>=80?'🔥':a.achievement>=50?'💪':'🤔';
    txt+=`${emoji} ${a.goalTitle}（達成度 ${a.achievement}%）\n`;
    if(a.good) txt+=`✅ ${a.good}\n`;
    if(a.bad)  txt+=`🔧 ${a.bad}\n`;
    if(a.tomorrow) txt+=`📅 明日：${a.tomorrow}\n`;
    txt+='\n';
  });
  return txt.trim();
}

function copyFinalResult(){
  const text=document.getElementById('final-result')?.textContent||'';
  navigator.clipboard.writeText(text).then(()=>{
    showToast('コピーしました！Slackに貼り付けてください');
  }).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('コピーしました');
  });
}

function restartQA(){
  document.getElementById('qa-wrap').style.display='none';
  document.getElementById('qa-start').style.display='block';
  renderQAStart();
}

  const [goalId,key]=bubbleId.split('__');
  const g=db.goals.find(x=>x.id===goalId);
  const ans=qa.answers[goalId];

  editCtx={goalId,key,type:key==='achievement'?'slider':'text'};

  const body=document.getElementById('edit-modal-body');

        oninput="document.getElementById('edit-slider-val').textContent=this.value+'%'">

  } else {
    const cur=ans[key]||'';
    body.innerHTML=`<div style="font-size:12px;color:var(--ink3);margin-bottom:6px;">内容を編集してください</div>
      <textarea id="edit-text-input" rows="4" style="width:100%;border:1.5px solid var(--border2);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:var(--surface);outline:none;resize:vertical;line-height:1.7;">${esc(cur)}</textarea>`;
    setTimeout(()=>document.getElementById('edit-text-input')?.focus(),80);
  }
  document.getElementById('edit-answer-modal').classList.add('show');
}
function closeEditModal(){ document.getElementById('edit-answer-modal').classList.remove('show'); editCtx=null; }
function applyEdit(){
  if(!editCtx) return;
  const {goalId,key,type}=editCtx;
  let newVal;
  if(type==='slider'){
    newVal=parseInt(document.getElementById('edit-slider-input').value);
    qa.answers[goalId].achievement=newVal;
    const el=document.getElementById(`bubble-text-${goalId}__achievement`);
    if(el) el.textContent=wrapLong(`達成度：${newVal}%`);
  } else {
    newVal=document.getElementById('edit-text-input').value.trim();
    if(!newVal){ showToast('内容を入力してください'); return; }
    qa.answers[goalId][key]=newVal;
    const el=document.getElementById(`bubble-text-${goalId}__${key}`);
    if(el) el.textContent=wrapLong(newVal);
  }
  closeEditModal();
  showToast('回答を修正しました');
}

// ===== HISTORY =====
function renderHistory(){
  const list=document.getElementById('history-list');
  const empty=document.getElementById('history-empty');
  const filter=document.getElementById('hist-filter');
  const sessions=[...db.sessions].reverse();
  const dates=[...new Set(sessions.map(s=>s.date))];
  filter.innerHTML='<option value="">すべての日付</option>'+dates.map(d=>`<option>${d}</option>`).join('');
  const filtered=filter.value?sessions.filter(s=>s.date===filter.value):sessions;
  if(!filtered.length){ list.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  list.innerHTML=filtered.map(s=>{
    const achList=(s.answers||[]).map(a=>`<span class="hist-ach">${esc(a.goalTitle||'')} ${a.achievement}%</span>`).join(' ');
    return `<div class="hist-item">
      <div class="hist-date">${s.date}</div>
      <div style="margin-bottom:6px;">${achList}</div>
      <div class="hist-summary">${esc(s.summary||'')}</div>
    </div>`;
  }).join('');
}

function clearHistory(){
  if(!confirm('全ての振り返り記録を削除しますか？')) return;
  db.sessions=[]; saveData(); renderHistory(); renderGoals();
  showToast('履歴を削除しました');
}

// ===== DATA =====
function exportData(){
  const blob=new Blob([JSON.stringify({db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`furikaeri_${dateStr().replace(/\//g,'-')}.json`; a.click();
  showToast('エクスポートしました');
}
function resetAll(){
  if(!confirm('全データを削除します。この操作は取り消せません。')) return;
  localStorage.removeItem('furi_db');
  location.reload();
}

// ===== TOAST =====
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

init();

  </script>
</body>
